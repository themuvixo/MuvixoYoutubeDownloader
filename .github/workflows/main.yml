name: 📁 Youtube Downloader
on:
  workflow_dispatch:
    inputs:
      youtube_urls:
        description: '🔗 YouTube/Spotify URL(s) — separate multiple with spaces'
        required: true
        type: string
      download_subtitles:
        description: '📝 Download subtitles (English & Persian)'
        required: false
        default: false
        type: boolean
      quality:
        description: '🎬 Video quality'
        required: false
        default: 'best'
        type: choice
        options:
          - best
          - 2160
          - 1440
          - 1080
          - 720
          - 480
          - 360
          - 260
          - 144
          - audio
      password:
        description: '🔒 Password for zip files (optional)'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  download-youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Banner
        run: |
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║   🎬  M U V I X O   —   Y O U T U B E   D O W N L O A D E R  ║"
          echo "╚══════════════════════════════════════════════════════════╝"
          echo ""
          echo "  ✨ Created by Muvixo"
          echo "  🏃 Runner: $(uname -a)"
          echo "  📦 Available Memory: $(free -h | grep Mem | awk '{print $2}')"
          echo ""

      - name: Start WARP Container
        run: |
          echo "──────────────────────────────────────────"
          echo " 🌐  NETWORK  ·  Starting Cloudflare WARP"
          echo "──────────────────────────────────────────"
          docker network create warp-net 2>/dev/null || true
          docker run -d \
            --name warp \
            --restart=always \
            --network warp-net \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            -v warp-data:/var/lib/cloudflare-warp \
            caomingjun/warp
          echo "⏳ Waiting for WARP to initialize (20s)..."
          sleep 20
          echo "🔎 Checking WARP status..."
          for i in {1..8}; do
            RESULT=$(curl -s --max-time 5 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace 2>/dev/null || echo "failed")
            if echo "$RESULT" | grep -qE "warp=(on|plus)"; then
              echo "✅ WARP is active!"
              echo "$RESULT"
              break
            else
              echo "   attempt $i/8 — not ready yet, waiting..."
              sleep 5
            fi
          done
          FINAL=$(curl -s --max-time 10 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace 2>/dev/null || echo "failed")
          if echo "$FINAL" | grep -qE "warp=(on|plus)"; then
            echo "✅ WARP proxy is ready!"
          else
            echo "⚠️  WARP might not be fully active, continuing anyway..."
          fi

      - name: Install Dependencies
        run: |
          echo "──────────────────────────────────────────"
          echo " 📦  SETUP  ·  Installing dependencies"
          echo "──────────────────────────────────────────"
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pip ffmpeg zip p7zip-full curl jq bc unzip
          
          # Install Deno — MUST be in PATH for yt-dlp to find it
          curl -fsSL https://deno.land/install.sh | sh
          export DENO_INSTALL="$HOME/.deno"
          export PATH="$DENO_INSTALL/bin:$PATH"
          echo "DENO_INSTALL=$DENO_INSTALL" >> $GITHUB_ENV
          echo "$DENO_INSTALL/bin" >> $GITHUB_PATH
          
          # Verify deno is accessible
          deno --version
          
          pip3 install --upgrade -q yt-dlp
          yt-dlp --version
          echo "✅ Dependencies ready."

      - name: Download Setup (functions & config)
        env:
          YT_URLS: ${{ github.event.inputs.youtube_urls }}
          YT_QUALITY: ${{ github.event.inputs.quality }}
          YT_PASSWORD: ${{ github.event.inputs.password }}
        run: |
          # Ensure deno is in PATH for this step too
          export PATH="$HOME/.deno/bin:$PATH"
          
          # ── Parse all URLs ────────────────────────────────────────────────
          URLS_RAW="${YT_URLS}"
          read -ra URL_LIST <<< "$URLS_RAW"
          TOTAL_URLS=${#URL_LIST[@]}
          QUALITY="${YT_QUALITY}"
          ZIP_PASSWORD="${YT_PASSWORD}"
          DOWNLOAD_SUBS="${{ github.event.inputs.download_subtitles }}"
          
          OUTPUT_DIR="/tmp/output"
          mkdir -p "$OUTPUT_DIR"
          echo "$OUTPUT_DIR" > /tmp/output_dir_path.txt
          > /tmp/video_info.txt
          
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║  📋  JOB SUMMARY                                            "
          echo "╚══════════════════════════════════════════════════════════╝"
          echo "  • URLs queued     : $TOTAL_URLS"
          echo "  • Quality         : $QUALITY"
          if [ -n "$ZIP_PASSWORD" ]; then
            echo "  • Password        : ENABLED 🔒"
          else
            echo "  • Password        : DISABLED"
          fi
          if [ "$DOWNLOAD_SUBS" = "true" ]; then
            echo "  • Subtitles       : ENABLED (en, fa) 📝"
          else
            echo "  • Subtitles       : DISABLED"
          fi
          echo "  • Output format   : Single MP4 (no split) 🎬"
          echo "  • Delivery        : GitHub Actions Artifact 📦"
          echo ""
          
          # ── Format string based on quality ──
          case "$QUALITY" in
            "audio")
              FORMAT="bestaudio/bestaudio*"
              ;;
            "best")
              FORMAT="bestvideo+bestaudio/best"
              ;;
            "2160"|"4k")
              FORMAT="bestvideo[height<=2160]+bestaudio/best[height<=2160]/best"
              ;;
            "1440"|"2k")
              FORMAT="bestvideo[height<=1440]+bestaudio/best[height<=1440]/best"
              ;;
            "1080")
              FORMAT="bestvideo[height<=1080]+bestaudio/best[height<=1080]/best"
              ;;
            "720")
              FORMAT="bestvideo[height<=720]+bestaudio/best[height<=720]/best"
              ;;
            "480")
              FORMAT="bestvideo[height<=480]+bestaudio/best[height<=480]/best"
              ;;
            "360")
              FORMAT="bestvideo[height<=360]+bestaudio/best[height<=360]/best"
              ;;
            "260")
              FORMAT="bestvideo[height<=260]+bestaudio/best[height<=260]/best"
              ;;
            "144")
              FORMAT="bestvideo[height<=144]+bestaudio/best[height<=144]/best"
              ;;
            *)
              FORMAT="bestvideo+bestaudio/best"
              ;;
          esac
          
          echo "$FORMAT" > /tmp/yt_format.txt
          echo "$QUALITY" > /tmp/yt_quality.txt
          echo "$ZIP_PASSWORD" > /tmp/yt_password.txt
          
          # ── Resolve Spotify URLs ──────────────────────────────────────────
          RESOLVED_URLS=()
          HAS_SPOTIFY=false
          
          resolve_spotify() {
            local URL="$1"
            echo "🎧 Spotify URL detected: $URL"
            
            local SPOTIFY_JSON SPOTIFY_TITLE SPOTIFY_AUTHOR
            SPOTIFY_JSON=$(curl -s "https://open.spotify.com/oembed?url=${URL}" 2>/dev/null || echo "{}")
            SPOTIFY_TITLE=$(echo "$SPOTIFY_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('title',''))" 2>/dev/null || echo "")
            SPOTIFY_AUTHOR=$(echo "$SPOTIFY_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('author_name',''))" 2>/dev/null || echo "")
            
            if [ -z "$SPOTIFY_TITLE" ]; then
              echo "⚠️  Could not resolve Spotify title, using raw URL."
              RESOLVED_URLS+=("$URL")
              return
            fi
            
            if [ -z "$SPOTIFY_AUTHOR" ]; then
              echo "ℹ️  oEmbed gave no artist — parsing track page..."
              SPOTIFY_AUTHOR=$(curl -s "${URL}" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" | python3 -c "import sys,re; s=sys.stdin.read(); m=re.search(r'Song\s*·\s*([^·]{1,80})', s); print(m.group(1).strip()) if m and m.group(1).strip() else ''" 2>/dev/null || true)
              if [ -n "$SPOTIFY_AUTHOR" ]; then
                echo "   👤 recovered artist: $SPOTIFY_AUTHOR"
              else
                echo "   ⚠️  still no artist — will search by title only."
              fi
            fi
            
            echo "🎧 Target: $SPOTIFY_TITLE — ${SPOTIFY_AUTHOR:-unknown}"
            SEARCH_Q="${SPOTIFY_TITLE}${SPOTIFY_AUTHOR:+ ${SPOTIFY_AUTHOR}}"
            
            # Search YouTube using Deno (use "deno" string, not path)
            yt-dlp \
              --proxy "socks5://127.0.0.1:1080" \
              --extractor-args "youtube:player_client=web" \
              --js-runtimes deno \
              --remote-components ejs:github \
              --skip-download --no-warnings --no-check-certificates \
              --print "%(id)s|||%(title)s|||%(channel)s" \
              "ytsearch10:${SEARCH_Q}" \
              2>/dev/null > /tmp/spotify_candidates.txt || true
            
            export SPOTIFY_TITLE SPOTIFY_AUTHOR
            CHOSEN_VIDEO=$(python3 <<'PY' 2>/dev/null || true
          import os, re
          def norm(s):
              s = (s or '').lower()
              s = re.sub(r'[^\w\s]', ' ', s)
              return re.sub(r'\s+', ' ', s).strip()
          
          author = norm(os.environ.get('SPOTIFY_AUTHOR', ''))
          au = {w for w in author.split() if w}
          cands = []
          try:
              with open('/tmp/spotify_candidates.txt', encoding='utf-8', errors='replace') as f:
                  for ln in f:
                      ln = ln.rstrip('\n').strip()
                      if not ln: continue
                      parts = ln.split('|||')
                      vid = parts[0].strip()
                      t = norm(parts[1]) if len(parts) > 1 else ''
                      ch = norm(parts[2]) if len(parts) > 2 else ''
                      if vid: cands.append((vid, t, ch))
          except: pass
          
          # Filter out movie results
          MOVIE = re.compile(r'(full\s*movie|فیلم|filme\s*farsi|film\s*farsi|filmnama|movie\s*\d|دانلود\s*فیلم)', re.I)
          visible = [(vid, t, ch) for vid, t, ch in cands if not (MOVIE.search(t) or MOVIE.search(ch))]
          
          def score(t, ch):
              s = 0
              if author:
                  if author in ch: s += 10
                  if author in t: s += 5
                  for w in au:
                      if w in ch: s += 3
                      if w in t: s += 1
              return s
          
          if visible:
              best = max(visible, key=lambda x: score(x[1], x[2]))
              print(f"https://www.youtube.com/watch?v={best[0]}")
          elif cands:
              best = max(cands, key=lambda x: score(x[1], x[2]))
              print(f"https://www.youtube.com/watch?v={best[0]}")
          else:
              print("")
          PY
            )
            
            if [ -n "$CHOSEN_VIDEO" ]; then
              echo "🔎 Verified match: $CHOSEN_VIDEO"
              RESOLVED_URLS+=("$CHOSEN_VIDEO")
            else
              echo "⚠️  Could not verify a match, using raw URL."
              RESOLVED_URLS+=("$URL")
            fi
          }
          
          for url in "${URL_LIST[@]}"; do
            if [[ "$url" =~ open\.spotify\.com|^spotify:|spotify\.com ]]; then
              HAS_SPOTIFY=true
              resolve_spotify "$url"
            else
              RESOLVED_URLS+=("$url")
            fi
          done
          
          if [ "$HAS_SPOTIFY" = true ]; then
            QUALITY="audio"
            FORMAT="bestaudio/bestaudio*"
            echo "$FORMAT" > /tmp/yt_format.txt
            echo "$QUALITY" > /tmp/yt_quality.txt
            echo "🎧 Spotify mode active — quality forced to audio (MP3)."
          fi
          
          printf "%s\n" "${RESOLVED_URLS[@]}" > /tmp/yt_urls.txt
          if [ "${#RESOLVED_URLS[@]}" -eq 0 ]; then
            echo "❌ No valid URLs to download."
            exit 1
          fi

      - name: Download YouTube Video(s)
        run: |
          # Deno must be in PATH
          export PATH="$HOME/.deno/bin:$PATH"
          
          FORMAT=$(cat /tmp/yt_format.txt)
          QUALITY=$(cat /tmp/yt_quality.txt)
          ZIP_PASSWORD=$(cat /tmp/yt_password.txt)
          OUTPUT_DIR=$(cat /tmp/output_dir_path.txt)
          mapfile -t URL_LIST < /tmp/yt_urls.txt
          TOTAL_URLS=${#URL_LIST[@]}
          
          sanitize_name() {
            echo "$1" | sed 's/ /-/g' | sed 's/　/-/g' | tr -s '-' | sed 's/[^a-zA-Z0-9_-]/-/g'
          }
          
          get_random_word() {
            RANDOM_WORDS=("alpha" "beta" "gamma" "delta" "epsilon" "zeta" "theta" "kappa" "lambda" "sigma" "omega" "nova" "star" "moon" "sun" "sky" "cloud" "river" "ocean" "mountain")
            echo "${RANDOM_WORDS[$RANDOM % ${#RANDOM_WORDS[@]}]}_$RANDOM"
          }
          
          get_unique_folder() {
            local BASE_PATH="$1"
            local NAME="$2"
            if [ ! -d "$BASE_PATH/$NAME" ]; then
              echo "$NAME"; return
            fi
            local RANDOM_SUFFIX=$(get_random_word)
            while [ -d "$BASE_PATH/${NAME}_${RANDOM_SUFFIX}" ]; do
              RANDOM_SUFFIX=$(get_random_word)
            done
            echo "${NAME}_${RANDOM_SUFFIX}"
          }
          
          download_video() {
            local METHOD=$1
            local URL=$2
            local TMP_DIR=$3
            echo "   ▸ trying method $METHOD..."
            
            if [ "$QUALITY" = "audio" ]; then
              COMMON_FLAGS="--extract-audio --audio-format mp3 --audio-quality 0 --write-thumbnail --convert-thumbnails jpg --no-cache-dir --output ${TMP_DIR}/%(title)s.%(ext)s --no-part --no-playlist --retries 10 --fragment-retries 10 --no-check-certificates --concurrent-fragments 8 --buffer-size 16K --http-chunk-size 10M --progress --newline"
            else
              COMMON_FLAGS="--merge-output-format mp4 --remux-video mp4 --write-thumbnail --convert-thumbnails jpg --no-cache-dir --output ${TMP_DIR}/%(title)s.%(ext)s --no-part --no-playlist --retries 10 --fragment-retries 10 --no-check-certificates --concurrent-fragments 8 --buffer-size 16K --http-chunk-size 10M --progress --newline"
            fi
            
            # CRITICAL: Use "deno" string, NOT full path. yt-dlp expects these exact values.
            case $METHOD in
              1)
                yt-dlp \
                  --proxy "socks5://127.0.0.1:1080" \
                  --format "$FORMAT" \
                  $COMMON_FLAGS \
                  --extractor-args "youtube:player_client=web" \
                  --js-runtimes deno \
                  --remote-components ejs:github \
                  --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
                  --add-header "Accept-Language:en-US,en;q=0.9" \
                  "$URL"
                ;;
              2)
                yt-dlp \
                  --proxy "socks5://127.0.0.1:1080" \
                  --format "$FORMAT" \
                  $COMMON_FLAGS \
                  --extractor-args "youtube:player_client=web" \
                  --js-runtimes deno \
                  --remote-components ejs:npm \
                  --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
                  --add-header "Accept-Language:en-US,en;q=0.9" \
                  "$URL"
                ;;
              3)
                yt-dlp \
                  --proxy "socks5://127.0.0.1:1080" \
                  --format "$FORMAT" \
                  $COMMON_FLAGS \
                  --extractor-args "youtube:player_client=web,mweb,android_vr" \
                  --js-runtimes deno \
                  --remote-components ejs:github \
                  "$URL"
                ;;
              4)
                yt-dlp \
                  --proxy "socks5://127.0.0.1:1080" \
                  --format "$FORMAT" \
                  $COMMON_FLAGS \
                  --extractor-args "youtube:player_client=mweb" \
                  "$URL"
                ;;
              5)
                yt-dlp \
                  --proxy "socks5://127.0.0.1:1080" \
                  --format "$FORMAT" \
                  $COMMON_FLAGS \
                  --extractor-args "youtube:player_client=android_vr" \
                  "$URL"
                ;;
              6)
                yt-dlp \
                  --format "$FORMAT" \
                  $COMMON_FLAGS \
                  --extractor-args "youtube:player_client=web" \
                  --js-runtimes deno \
                  --remote-components ejs:github \
                  "$URL"
                ;;
              7)
                yt-dlp \
                  --format "$FORMAT" \
                  $COMMON_FLAGS \
                  --extractor-args "youtube:player_client=mweb" \
                  "$URL"
                ;;
              8)
                yt-dlp \
                  --proxy "socks5://127.0.0.1:1080" \
                  --format "$FORMAT" \
                  $COMMON_FLAGS \
                  --extractor-args "youtube:player_client=android" \
                  --user-agent "Mozilla/5.0 (Linux; Android 12; SM-S906N Build/QP1A.190711.020) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/112.0.0.0 Mobile Safari/537.36" \
                  "$URL"
                ;;
            esac
          }
          
          URL_INDEX=0
          for URL in "${URL_LIST[@]}"; do
            URL_INDEX=$((URL_INDEX + 1))
            echo ""
            echo "╔══════════════════════════════════════════════════════════╗"
            echo "║  ⬇️  DOWNLOAD  ·  URL $URL_INDEX / $TOTAL_URLS"
            echo "╚══════════════════════════════════════════════════════════╝"
            echo "  🔗 $URL"
            echo ""
            
            TMP_DIR="tmp_downloads_${URL_INDEX}"
            mkdir -p "$TMP_DIR"
            
            echo "🔎 Checking available formats..."
            FORMAT_LISTING=$(yt-dlp -F --proxy "socks5://127.0.0.1:1080" --js-runtimes deno --remote-components ejs:github "$URL" 2>&1 || true)
            
            if echo "$FORMAT_LISTING" | grep -qiE "members[ -]?only|subscriber[ -]?only|available to this channel'?s members|join this channel|LOGIN_REQUIRED"; then
              echo ""
              echo "╔══════════════════════════════════════════════════════════╗"
              echo "║   🔒  MEMBERS ONLY VIDEO DETECTED                          "
              echo "╚══════════════════════════════════════════════════════════╝"
              echo "  🔗 $URL"
              echo "  ⚠️  This video is members-only / subscriber-only and"
              echo "      cannot be downloaded."
              echo "  ❌  Skipping this URL."
              echo ""
              rm -rf "$TMP_DIR"
              continue
            fi
            
            echo "$FORMAT_LISTING" | grep -E "^[0-9]+" | head -20 || true
            echo ""
            
            DOWNLOAD_SUCCESS=false
            for METHOD in 1 2 3 4 5 6 7 8; do
              if download_video $METHOD "$URL" "$TMP_DIR"; then
                echo "   ✅ download successful with method $METHOD!"
                QUALITY_OK=true
                
                if [ "$QUALITY" != "best" ] && [ "$QUALITY" != "audio" ]; then
                  for DOWNLOADED_FILE in "$TMP_DIR"/*.mp4 "$TMP_DIR"/*.webm "$TMP_DIR"/*.mkv; do
                    [ -f "$DOWNLOADED_FILE" ] || continue
                    ACTUAL_HEIGHT=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$DOWNLOADED_FILE" 2>/dev/null || echo "unknown")
                    echo "   🎯 requested ${QUALITY}p → actual ${ACTUAL_HEIGHT}px"
                    if [ "$ACTUAL_HEIGHT" != "unknown" ] && [ "$ACTUAL_HEIGHT" -lt $(( QUALITY - 50 )) ] 2>/dev/null; then
                      echo "   ⚠️  method $METHOD delivered ${ACTUAL_HEIGHT}p instead of ${QUALITY}p — rejecting, trying next method..."
                      QUALITY_OK=false
                      rm -f "$DOWNLOADED_FILE"
                    else
                      echo "   ✅ quality check passed."
                    fi
                  done
                elif [ "$QUALITY" = "best" ]; then
                  for DOWNLOADED_FILE in "$TMP_DIR"/*.mp4 "$TMP_DIR"/*.webm "$TMP_DIR"/*.mkv; do
                    [ -f "$DOWNLOADED_FILE" ] || continue
                    ACTUAL_HEIGHT=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$DOWNLOADED_FILE" 2>/dev/null || echo "unknown")
                    echo "   🎯 best quality → actual ${ACTUAL_HEIGHT}px"
                    if [ "$ACTUAL_HEIGHT" != "unknown" ] && [ "$ACTUAL_HEIGHT" -le 360 ] 2>/dev/null && [ $METHOD -lt 8 ]; then
                      echo "   ⚠️  method $METHOD only got ${ACTUAL_HEIGHT}p for 'best' — trying next method..."
                      QUALITY_OK=false
                      rm -f "$DOWNLOADED_FILE"
                    fi
                  done
                fi
                
                if [ "$QUALITY_OK" = true ]; then
                  DOWNLOAD_SUCCESS=true
                  break
                fi
              else
                echo "   ❌ method $METHOD failed, waiting 3s..."
                sleep 3
              fi
            done
            
            if [ "$DOWNLOAD_SUCCESS" = false ]; then
              echo ""
              echo "  ❌ All download methods failed for this URL — skipping."
              rm -rf "$TMP_DIR"
              continue
            fi
            
            find "$TMP_DIR" -name "*.part" -delete
            echo ""
            echo "  ✅ Download complete!"
            echo "  Files:"
            ls -la "$TMP_DIR/"
            
            for FILE in "$TMP_DIR"/*; do
              [ -f "$FILE" ] || continue
              if [[ "$FILE" == *.jpg ]] || [[ "$FILE" == *.webp ]]; then
                continue
              fi
              
              SIZE=$(stat -c%s "$FILE")
              BASENAME=$(basename "$FILE")
              FILENAME_NO_EXT="${BASENAME%.*}"
              EXT="${BASENAME##*.}"
              FILENAME_NO_EXT=$(sanitize_name "$FILENAME_NO_EXT")
              SIZE_MB=$(echo "scale=2; $SIZE / 1024 / 1024" | bc)
              
              echo ""
              echo "  ──────────────────────────────────────────"
              echo "  📦 Packaging: $BASENAME (${SIZE_MB} MB)"
              echo "  ──────────────────────────────────────────"
              
              FINAL_FOLDER_NAME=$(get_unique_folder "$OUTPUT_DIR" "$FILENAME_NO_EXT")
              mkdir -p "$OUTPUT_DIR/${FINAL_FOLDER_NAME}"
              
              THUMB_FILE=$(ls "$TMP_DIR"/*.jpg 2>/dev/null | head -1)
              HAS_THUMB=false
              if [ -n "$THUMB_FILE" ] && [ -f "$THUMB_FILE" ]; then
                cp "$THUMB_FILE" "$OUTPUT_DIR/${FINAL_FOLDER_NAME}/thumbnail.jpg"
                HAS_THUMB=true
                echo "  🖼️  thumbnail saved"
              else
                echo "  ⚠️  no thumbnail available"
              fi
              
              echo "${FILENAME_NO_EXT}|${FINAL_FOLDER_NAME}|${URL}|${SIZE_MB}|${HAS_THUMB}" >> /tmp/video_info.txt
              
              if [ -n "$ZIP_PASSWORD" ]; then
                echo "  🔒 creating password-protected zip..."
                zip -0 -P "${ZIP_PASSWORD}" \
                  "$OUTPUT_DIR/${FINAL_FOLDER_NAME}/${FINAL_FOLDER_NAME}.zip" \
                  "$FILE" >/dev/null 2>&1
                echo "  ✅ archive created."
              else
                echo "  📄 saving as single ${EXT} file..."
                cp "$FILE" "$OUTPUT_DIR/${FINAL_FOLDER_NAME}/${FINAL_FOLDER_NAME}.${EXT}"
                echo "  ✅ saved."
              fi
              
              README_FILE="$OUTPUT_DIR/${FINAL_FOLDER_NAME}/README.md"
              {
                echo "# 🎬 ${FILENAME_NO_EXT}"
                echo ""
                echo "---"
                echo ""
                echo "### 📋 Video Info"
                echo ""
                echo "| Property | Value |"
                echo "|---|---|"
                echo "| **Title** | \`${FILENAME_NO_EXT}\` |"
                echo "| **Quality** | ${QUALITY} |"
                echo "| **Size** | ${SIZE_MB} MB |"
                if [ -n "$ZIP_PASSWORD" ]; then
                  echo "| **Format** | \`${FINAL_FOLDER_NAME}.zip\` (password-protected) |"
                else
                  echo "| **Format** | \`${FINAL_FOLDER_NAME}.${EXT}\` (single file, ready to play) |"
                fi
                echo "| **Status** | ✅ Complete |"
                echo ""
                echo "---"
                echo ""
                echo "<p align=\"center\"><sub>✨ Created by <b>Muvixo</b></sub></p>"
              } > "$README_FILE"
              echo "  📝 README.md generated"
            done
            
            rm -rf "$TMP_DIR"
            echo ""
            echo "  ✅ Finished URL $URL_INDEX / $TOTAL_URLS"
          done
          
          echo ""
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║  📂  OUTPUT FOLDER CONTENTS                                 "
          echo "╚══════════════════════════════════════════════════════════╝"
          find "$OUTPUT_DIR" -type f 2>/dev/null | head -50

      - name: Download Subtitles
        if: ${{ github.event.inputs.download_subtitles == 'true' }}
        run: |
          set +e
          export PATH="$HOME/.deno/bin:$PATH"
          
          OUTPUT_DIR=$(cat /tmp/output_dir_path.txt)
          mapfile -t URL_LIST < /tmp/yt_urls.txt
          
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║  📝  SUBTITLES                                              "
          echo "╚══════════════════════════════════════════════════════════╝"
          
          sub_download() {
            local MODE=$1
            local OUT="$2"
            local SURL="$3"
            local SUB_DIR
            SUB_DIR=$(dirname "$OUT")
            
            sub_count() { find "$SUB_DIR" -type f \( -name "*.vtt" -o -name "*.srt" \) 2>/dev/null | wc -l; }
            fa_count()  { find "$SUB_DIR" -type f \( -name "*.fa.vtt" -o -name "*.fa.srt" \) 2>/dev/null | wc -l; }
            en_count()  { find "$SUB_DIR" -type f \( -name "*.en.vtt" -o -name "*.en.srt" \) 2>/dev/null | wc -l; }
            
            sub_flags() {
              case $MODE in
                all)        echo "--write-sub --sub-langs fa,en" ;;
                fa-native)  echo "--write-sub --sub-langs fa" ;;
                fa-auto)    echo "--write-auto-sub --sub-langs fa" ;;
                en-auto)    echo "--write-auto-sub --sub-langs en" ;;
                auto-both)  echo "--write-auto-sub --sub-langs en,fa" ;;
              esac
            }
            
            SFLAGS=$(sub_flags)
            COMMON_SUB="--sub-format vtt/srt/best --convert-subs vtt --skip-download --no-playlist --no-check-certificates --output ${OUT}"
            
            for METHOD in 1 2 3 4 5 6 7 8; do
              echo "   ▸ subtitle method $METHOD ..."
              case $METHOD in
                1)
                  yt-dlp \
                    --proxy "socks5://127.0.0.1:1080" \
                    --extractor-args "youtube:player_client=web" \
                    --js-runtimes deno \
                    --remote-components ejs:github \
                    --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
                    --add-header "Accept-Language:en-US,en;q=0.9" \
                    $SFLAGS $COMMON_SUB "$SURL" 2>&1 || true
                    ;;
                2)
                  yt-dlp \
                    --proxy "socks5://127.0.0.1:1080" \
                    --extractor-args "youtube:player_client=web" \
                    --js-runtimes deno \
                    --remote-components ejs:npm \
                    --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
                    --add-header "Accept-Language:en-US,en;q=0.9" \
                    $SFLAGS $COMMON_SUB "$SURL" 2>&1 || true
                  ;;
                3)
                  yt-dlp \
                    --proxy "socks5://127.0.0.1:1080" \
                    --extractor-args "youtube:player_client=web,mweb,android_vr" \
                    --js-runtimes deno \
                    --remote-components ejs:github \
                    $SFLAGS $COMMON_SUB "$SURL" 2>&1 || true
                  ;;
                4)
                  yt-dlp \
                    --proxy "socks5://127.0.0.1:1080" \
                    --extractor-args "youtube:player_client=mweb" \
                    $SFLAGS $COMMON_SUB "$SURL" 2>&1 || true
                  ;;
                5)
                  yt-dlp \
                    --proxy "socks5://127.0.0.1:1080" \
                    --extractor-args "youtube:player_client=android_vr" \
                    $SFLAGS $COMMON_SUB "$SURL" 2>&1 || true
                  ;;
                6)
                  yt-dlp \
                    --extractor-args "youtube:player_client=web" \
                    --js-runtimes deno \
                    --remote-components ejs:github \
                    $SFLAGS $COMMON_SUB "$SURL" 2>&1 || true
                  ;;
                7)
                  yt-dlp \
                    --extractor-args "youtube:player_client=mweb" \
                    $SFLAGS $COMMON_SUB "$SURL" 2>&1 || true
                  ;;
                8)
                  yt-dlp \
                    --proxy "socks5://127.0.0.1:1080" \
                    --extractor-args "youtube:player_client=android" \
                    --user-agent "Mozilla/5.0 (Linux; Android 12; SM-S906N Build/QP1A.190711.020) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/112.0.0.0 Mobile Safari/537.36" \
                    $SFLAGS $COMMON_SUB "$SURL" 2>&1 || true
                  ;;
              esac
              
              if [ "$MODE" = "fa-native" ] || [ "$MODE" = "fa-auto" ]; then
                [ "$(fa_count)" -gt 0 ] && { echo "   ✅ success with method $METHOD"; return 0; }
              elif [ "$MODE" = "en-auto" ]; then
                [ "$(en_count)" -gt 0 ] && { echo "   ✅ success with method $METHOD"; return 0; }
              elif [ "$MODE" = "auto-both" ]; then
                local EN_GOT=$(en_count)
                local FA_GOT=$(fa_count)
                if [ "$EN_GOT" -gt 0 ] && [ "$FA_GOT" -gt 0 ]; then
                  echo "   ✅ success with method $METHOD (both en+fa)"
                  return 0
                elif [ "$EN_GOT" -gt 0 ] || [ "$FA_GOT" -gt 0 ]; then
                  echo "   ⚠️  partial success (en:$EN_GOT, fa:$FA_GOT), trying next method..."
                fi
              else
                [ "$(sub_count)" -gt 0 ] && { echo "   ✅ success with method $METHOD"; return 0; }
              fi
              sleep 1
            done
            echo "   ⚠️  all 8 methods failed for mode: $MODE"
            return 1
          }
          
          while IFS='|' read -r ORIGINAL_NAME FOLDER_NAME VIDEO_URL VIDEO_SIZE HAS_THUMB; do
            [ -z "$FOLDER_NAME" ] && continue
            
            SUBTITLE_DIR="$OUTPUT_DIR/${FOLDER_NAME}/subtitle"
            mkdir -p "$SUBTITLE_DIR"
            OUT_TMPL="${SUBTITLE_DIR}/%(title)s"
            
            echo ""
            echo "  ──────────────────────────────────────────"
            echo "  📝 Subtitles for: $FOLDER_NAME"
            echo "  ──────────────────────────────────────────"
            echo "  → fetching original subtitles (en, fa, and others)..."
            sub_download "all" "$OUT_TMPL" "$VIDEO_URL" || true
            
            EN_COUNT=$(find "$SUBTITLE_DIR" -type f \( -name "*.en.vtt" -o -name "*.en.srt" \) 2>/dev/null | wc -l)
            FA_COUNT=$(find "$SUBTITLE_DIR" -type f \( -name "*.fa.vtt" -o -name "*.fa.srt" \) 2>/dev/null | wc -l)
            
            [ "$EN_COUNT" -gt 0 ] && echo "  ✅ English subtitle present (native)." || echo "  ⚠️  no native English subtitle."
            [ "$FA_COUNT" -gt 0 ] && echo "  ✅ Persian subtitle present (native)." || echo "  ⚠️  no native Persian subtitle."
            
            if [ "$EN_COUNT" -eq 0 ] || [ "$FA_COUNT" -eq 0 ]; then
              echo "  → downloading auto-generated subtitles (en, fa)..."
              sub_download "auto-both" "$OUT_TMPL" "$VIDEO_URL" || true
              EN_COUNT=$(find "$SUBTITLE_DIR" -type f \( -name "*.en.vtt" -o -name "*.en.srt" \) 2>/dev/null | wc -l)
              FA_COUNT=$(find "$SUBTITLE_DIR" -type f \( -name "*.fa.vtt" -o -name "*.fa.srt" \) 2>/dev/null | wc -l)
            fi
            
            SUB_COUNT=$(find "$SUBTITLE_DIR" -type f 2>/dev/null | wc -l)
            if [ "$SUB_COUNT" -eq 0 ]; then
              echo "  (no subtitles available for this video)"
              rmdir "$SUBTITLE_DIR" 2>/dev/null || true
            else
              echo "  → zipping $SUB_COUNT subtitle file(s) → subtitle.zip ..."
              ZIP_PATH="$OUTPUT_DIR/${FOLDER_NAME}/subtitle.zip"
              if (cd "$SUBTITLE_DIR" && zip -j "$ZIP_PATH" ./* 2>&1); then
                rm -rf "$SUBTITLE_DIR"
                echo "  ✅ subtitle.zip created"
              else
                echo "  ⚠️  zip command failed — continuing without subtitles"
                rm -rf "$SUBTITLE_DIR" 2>/dev/null || true
              fi
            fi
          done < /tmp/video_info.txt
          echo ""
          echo "✅ Subtitle phase complete."

      - name: Stop WARP Container
        if: always()
        run: |
          docker stop warp 2>/dev/null || true
          docker rm warp 2>/dev/null || true

      - name: Prepare Artifact Summary
        if: always()
        run: |
          OUTPUT_DIR=$(cat /tmp/output_dir_path.txt 2>/dev/null || echo "/tmp/output")
          FILE_COUNT=$(find "$OUTPUT_DIR" -type f 2>/dev/null | wc -l)
          TOTAL_SIZE=$(du -sh "$OUTPUT_DIR" 2>/dev/null | cut -f1)
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║  📦  ARTIFACT SUMMARY                                       "
          echo "╚══════════════════════════════════════════════════════════╝"
          echo "  • Files packed  : $FILE_COUNT"
          echo "  • Total size    : ${TOTAL_SIZE:-0}"
          echo ""
          find "$OUTPUT_DIR" -type f 2>/dev/null | sort

      - name: Upload Download as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muvixo-youtube-download-${{ github.run_id }}
          path: /tmp/output
          if-no-files-found: warn
          retention-days: 7

      - name: Get Artifact ID
        if: always()
        id: artifact_info
        run: |
          ARTIFACT_ID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            | jq -r '.artifacts[0].id')
          echo "artifact_id=$ARTIFACT_ID" >> $GITHUB_OUTPUT
          echo "artifact_url=${{ github.api_url }}/repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" >> $GITHUB_OUTPUT

      - name: Print Download Link
        if: always()
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ARTIFACT_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts"
          DIRECT_API_URL="${{ github.api_url }}/repos/${{ github.repository }}/actions/artifacts/${{ steps.artifact_info.outputs.artifact_id }}/zip"
          
          echo ""
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║                    ✅  A L L   D O N E                     ║"
          echo "╚══════════════════════════════════════════════════════════╝"
          echo ""
          echo "  📦 DIRECT DOWNLOAD LINKS:"
          echo ""
          echo "  🔗 Web UI (click to download):"
          echo "     ${ARTIFACT_URL}"
          echo ""
          echo "  🔗 API (for curl/wget, requires authentication):"
          echo "     ${DIRECT_API_URL}"
          echo ""
          echo "  📋 Workflow run: ${RUN_URL}"
          echo ""
          echo "  📦 Artifact name : muvixo-youtube-download-${{ github.run_id }}"
          echo "  🎬 Format        : Single MP4 file (no size limit inside artifact)"
          echo "  🗓️  Available for : 7 days"
          echo ""
          echo "  💡 To download via curl:"
          echo "     curl -L -H \"Authorization: token YOUR_GITHUB_TOKEN\" \\"
          echo "          -o muvixo-download.zip ${DIRECT_API_URL}"
          echo ""
          echo "──────────────────────────────────────────"
          echo "        ✨ Created by Muvixo ✨"
